name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write

jobs:
  jars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'corretto'
          cache: maven

      - name: Package (skip tests)
        run: mvn -B -DskipTests clean package

      - name: Upload jars to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kronotop/target/kronotop-[0-9]*.jar
            kronotop-cli/target/kronotop-cli-[0-9]*.jar
            kronotop-ctl/target/kronotop-ctl-[0-9]*.jar

      - name: Prepare Docker build context
        run: |
          cp kronotop/target/kronotop-[0-9]*.jar docker/kronotop.jar
          cp kronotop-ctl/target/kronotop-ctl-[0-9]*.jar docker/kronotop-ctl.jar
          cp kronotop-cli/target/kronotop-cli-[0-9]*.jar docker/kronotop-cli.jar
          cp bin/kronotop-server docker/kronotop-server

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: docker
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/kronotop/kronotop:latest
            ghcr.io/kronotop/kronotop:${{ github.event.release.tag_name }}
